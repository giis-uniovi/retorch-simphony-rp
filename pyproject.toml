[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "simphonyrp"
version = "2024.0.0"
dependencies = [
    "setuptools==83.0.0",
    "flake8== 7.3.0",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "scipy==1.16.2",
    "openpyxl==3.1.5",
    "seaborn==0.13.2",
    "matplotlib==3.10.7"
]

requires-python = ">=3.12"

authors = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" },
    { name = "Antonia Bertolino", email = "antonia.bertolino@gssi.it" },
    { name = "Guglielmo De Angelis", email = "guglielmo.deangelis@iasi.cnr.it" },
    { name = "Claudio de la Riva", email = "claudio@uniovi.es" },
    { name = "Francesca Lonetti", email = "francesca.lonetti@isti.cnr.it" },
    { name = "Jesús Morán", email = "moranjesus@uniovi.es" }

]
maintainers = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]

description = "Replication package for 'SIMPHONY: Similarity-based Resource Orchestration for System Testing'"
readme = "README.md"

[project.scripts]
experiment = "simphonyrp.experimentation:main"

[tool.setuptools]
packages = ["simphonyrp"]

[project.urls]
Homepage = "https://github.com/giis-uniovi/retorch-simphony-rp"
Repository = "https://github.com/giis-uniovi/retorch-simphony-rp"
"Bug Tracker" = "https://github.com/giis-uniovi/retorch-simphony-rp/issues"

[tool.pytest.ini_options]
addopts = "--cov=sample --cov-report=xml:coverage.xml --cov-branch"
#Configurations related to logging in testing, first
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"